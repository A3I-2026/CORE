model:
  arch: mini_gpt4rec_v2
  model_type: pretrain_vicuna
  use_lora: false           
  freeze_lora: true        
  freeze_rec: true         
  freeze_proj: False       
  max_txt_len: 1024
  proj_token_num: 1
  proj_drop: 0.01  #0, "0.1",0.05,0.2,0.3,0.5
  proj_mid_times: 2
  #proj_mid: 3
  end_sym: "###"
  #use_grad_ckpt: true
  enable_soft_prompt: true
    # --- Soft Prompt---
  use_text_prompt: True
  soft_prompt: "soft_prompt_v2" 
  soft_prompt_len: 3     
  freeze_soft_prompt: False 
  # --- distill ---
  distill_weight: 0.15      
  distill_text: "Analyze the user's history and predict if the user will like the target item."
  prompt_path: "/your/path/CORE/prompts/core_movie.txt"
  llama_model: "/your/path/CORE/minigpt4rec-log/vicuna-7b"
  user_num: -100
  item_num: -100
  ans_type: "v2"
  rec_model: "MF"
  lora_config:
    use_lora: true
    r: 64
    alpha: 128
    target_modules: ["q_proj","v_proj","o_proj"] 
    dropout: 0.05
  rec_config:
    user_num: -100
    item_num: -100
    embedding_size:  4096
    pretrained_path:  "/your/path/CORE/minigpt4rec-log/0912_ml1m_oodv2_best_model_d256lr-0.001wd0.0001.pth"  

datasets:
  movie_ood:
    path: "/your/path/CORE/datasets/ml-1m/"
    data_type: default
    build_info:
      storage: "/your/path/CORE/datasets/ml-1m/"
    #sample_ratio: 1.0
    few_shot_size:  15000
    selected_indices_path:  "/your/path/CORE/dataprune/prune/selected/ml-1m_adaptive_coreset.txt"


run:
  task: rec_pretrain
  lr_sched: "linear_warmup_cosine_lr" #"cosine"
  init_lr:   8e-4
  min_lr: 1e-6 
  warmup_lr: 1e-5 
  mode: 'v2'
  weight_decay: 0.1
  max_epoch: 10
  iters_per_epoch:  60
  batch_size_train: 16
  batch_size_eval: 128
  num_workers: 4
  warmup_steps: 200
  seed: 42
  output_dir:  "/your/path/CORE/minigpt4rec-log/CIE" 
  amp: False
  resume_ckpt_path:   "/your/path/CORE//minigpt4rec-log/stage2_init_merged_ml.pth" 
  resume_reset_epoch: True
  evaluate: False
  train_splits: ["train"]
  valid_splits: ["valid"]
  test_splits: ["test","valid"]  
  device: "npu"
  world_size: 1
  dist_url:  "tcp://127.0.0.1:xxx"
  distributed: false
  accum_grad_iters: 8
  rec_lr_scale: 0.05 #0.05
  patience: 5
  best_metric_name: uauc #uauc
  best_metric_mode: max
  ddp_find_unused_parameters: false #True
  eval_ndcg_topks: [10, 20]
  eval_hr_topks: [10, 20]
  min_improve: 5e-5

