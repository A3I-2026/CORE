model:
  arch: mini_gpt4rec_v2
  model_type: pretrain_vicuna
# --- 核心训练控制 ---
  use_lora: True           # 开启 LoRA 模块
  freeze_lora: True        # 保持 Stage 1a 训练好的文本认知
  freeze_rec: True         # 冻结底层推荐模型 (MF)
  freeze_proj: true       # [关键] 解冻 CIE 映射层，让它学习如何将 Book 特征对齐到 LLM
  max_txt_len: 1024
  proj_token_num: 1
  proj_drop: 0
  proj_mid_times: 2
  end_sym: "###"
  enable_soft_prompt: True
    # --- Soft Prompt 配置 ---
  use_text_prompt: True
  soft_prompt: "soft_prompt_v2"
  soft_prompt_len: 3      
  freeze_soft_prompt: False 
  # --- 蒸馏配置 ---
  distill_weight: 0.15      
  distill_text: "Analyze the user's history and predict if the user will like the target item."
  prompt_path: "/root/CoLLM-main/CoLLM/prompts/softprompt_amazon.txt"
  llama_model: "/tuili/CoLLM/vicuna-7b"
  user_num: -100
  item_num: -100
  ans_type: "v2"
  rec_model: "soft_prompt"
  lora_config:
    use_lora: True
    r: 64
    alpha: 128
    target_modules: ["q_proj","v_proj","o_proj"] 
    dropout: 0.05
  rec_config:
    user_num: -100
    item_num: -100
    embedding_size: 4096
    pretrained_path: "/root/CoLLM-main/CoLLM/minigpt4rec-log/0912_ml1m_oodv2_best_model_d256lr-0.001wd0.0001.pth"  

datasets:

  amazon_ood:
    path: "/root/CoLLM-main/CoLLM/collm-datasets/book/"
    data_type: default
    build_info:
      storage: "/root/CoLLM-main/CoLLM/collm-datasets/amazon-book/"
    few_shot_size: 500000
    selected_indices_path: "/root/CoLLM-main/DEALRec-main/code/prune/selected/collm_mapped_book_samples.txt"


run:
  task: rec_pretrain
  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 1e-5             
  min_lr: 1e-6 
  warmup_lr: 1e-6 
  mode: 'v2'
  weight_decay: 0.01
  max_epoch: 30
  iters_per_epoch: 150
  batch_size_train: 16
  batch_size_eval: 128
  num_workers: 4
  warmup_steps: 200
  seed: 42
  output_dir: "/tuili/minigpt4rec-log/book_pod"
  amp: true
  
  # [重要] 这里的 resume_ckpt_path 必须指向你 Stage 1a 跑出的 0.666+ 那个最佳 LoRA 权重
  resume_ckpt_path: "/tuili/minigpt4rec-log/amazonbook/202604220434/checkpoint_best.pth" 
  resume_reset_epoch: True
  evaluate: False
  train_splits: ["train"]
  valid_splits: ["valid"]
  test_splits: ["test","valid"]
  device: "npu"
  world_size: 1
  dist_url: "tcp://127.0.0.1:29502"
  distributed: false
  accum_grad_iters: 8
  rec_lr_scale: 0.05
  patience: 10
  best_metric_name: uauc
  best_metric_mode: max