model:
  arch: mini_gpt4rec_v2
  model_type: pretrain_vicuna
  
  use_lora: True           
  freeze_lora: False        
  freeze_rec: True        
  freeze_proj: True       
  
  max_txt_len: 512         
  proj_token_num: 1
  proj_drop: 0
  proj_mid_times: 2      
  end_sym: "###"
  
# --- Soft Prompt ---
  enable_soft_prompt: True
  soft_prompt: "soft_prompt_v2"
  soft_prompt_len: 20       
  freeze_soft_prompt: False 
  
# --- distill ---
  distill_weight: 0.15     
  distill_text: "Analyze the user's history and predict if the user will like the target item."
  
  prompt_path: "/your/path/CORE/prompts/core_sports.txt"
  use_text_prompt: True
  prompt_template: "User history: <ItemTitleList>\nTarget: <TargetItemTitle>\nIs this a good recommendation? Answer Yes or No."
  llama_model: "/your/path/CORE/minigpt4rec-log/vicuna-7b"
  user_num: -100
  item_num: -100
  ans_type: "v2"
  
  rec_model: "MF"          
  lora_config:
    use_lora: True
    r: 64
    alpha: 128
    target_modules: ["q_proj","v_proj","o_proj"]
    dropout: 0.05
    
  rec_config:
    user_num: -100
    item_num: -100
    embedding_size: 1024
    pretrained_path: "/your/path/CORE/minigpt4rec-log/sports_mf_best_d256.pth"

datasets:
  amazon_ood:
    path: "/your/path/CORE/datasets/sports/"
    data_type: default
    build_info:
      storage: "/root/CoLLM-main/CoLLM/datasets/sports/"
    selected_indices_path:  "/your/path/CORE/dataprune/prune/selected/amazon_sports_indices.txt"
    few_shot_size: 500000 

run:
  task: rec_pretrain
  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 1e-6             
  min_lr: 5e-4 
  warmup_lr: 1e-4 
  mode: 'v2'
  weight_decay: 0.05
  max_epoch: 20            
  iters_per_epoch: 500      
  batch_size_train: 16      
  batch_size_eval: 512      
  num_workers: 8            
  warmup_steps: 100
  seed: 42
  output_dir: "/your/path/CORE/minigpt4rec-log/sports_stage2_pod"
  
  amp: true 

  resume_ckpt_path: "/your/path/CORE/minigpt4rec-log/sports_lora/xxxx/checkpoint_best.pth"
  resume_reset_epoch: True  
  
  evaluate: False
  train_splits: ["train"]
  valid_splits: ["valid"]
  test_splits: ["test"]
  device: "npu"
  world_size: 1
  distributed: False
  dist_url: "tcp://127.0.0.1:xxx"
  accum_grad_iters: 4       
