model:
  arch: mini_gpt4rec_v2
  model_type: pretrain_vicuna
  freeze_rec: True
  freeze_proj: False
  freeze_soft_prompt: True
  freeze_lora: False
  max_txt_len: 1024
  proj_token_num: 1
  proj_drop: 0
  proj_mid_times: 2
  end_sym: "###"
  use_grad_ckpt: True
  enable_soft_prompt: False
  soft_prompt_len: 0
  soft_prompt_bank_size: 0
  distill_weight: 0.0
  prompt_path: "/your/path/CORE/prompts/core_amazon.txt"
  use_text_prompt: True
  prompt_template: "User history: <ItemTitleList>\nTarget: <TargetItemTitle>\nIs this a good recommendation? Answer Yes or No."
  llama_model: "/your/path/CORE/vicuna-7b"
  user_num: -100
  item_num: -100
  ans_type: "v2"
  rec_model: "MF"
  lora_config:
    use_lora: True
    r:  64
    alpha: 128
    target_modules: ["q_proj","v_proj","o_proj"]
    dropout: 0.1
  rec_config:
    user_num: -100
    item_num: -100
    embedding_size:  4096
    pretrained_path:  "/your/path/CORE/minigpt4rec-log/0923_book_oodv2_best_model_d256lr-0.001wd1e-06.pth" 
datasets:
  amazon_ood:
    path: "/your/path/CORE/datasets/amazon-book/"
    data_type: default
    build_info:
      storage: "/your/path/CORE/datasets/amazon-book/"
    selected_indices_path:   "/your/path/CORE/dataprune/prune/selected/amazon_book_indices.txt"
    few_shot_size:   500000 

run:
  task: rec_pretrain
  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 1e-4
  min_lr: 1e-6
  warmup_lr: 1e-4
  mode: "v2"
  weight_decay: 5e-2
  max_epoch: 100
  iters_per_epoch: 100 # AmazonBook
  batch_size_train: 16
  batch_size_eval: 128
  num_workers: 4
  warmup_steps: 200
  seed: 42
  output_dir: "/your/path/CORE/minigpt4rec-log/amazonbook"
  amp: true

  resume_ckpt_path: null
  resume_reset_epoch: False
  evaluate: False
  train_splits: ["train"]
  valid_splits: ["valid"]
  test_splits: ["test","valid"]
  device: "npu"
  world_size: 1
  dist_url: "tcp://127.0.0.1:xxx"
  distributed: false
  accum_grad_iters: 8
  rec_lr_scale: 0.05
  patience: 20
  best_metric_name:  uauc 
  best_metric_mode: max
  ddp_find_unused_parameters: false

  eval_ndcg_topks: [10, 20]
  eval_hr_topks: [10, 20]
  min_improve: 5e-5
